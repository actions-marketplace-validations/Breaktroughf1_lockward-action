name: Lockward Verify
description: Fail CI when AI-agent skills, MCP servers, hooks or rules files drift from lockward.lock or break policy.
author: Breaktrough
branding:
  icon: lock
  color: green

inputs:
  version:
    description: "Lockward release to install, without the leading v. The checksum and Sigstore signature are verified before it runs."
    required: false
    default: "0.2.3"
  args:
    description: Arguments passed to lockward.
    required: false
    default: verify --frozen
  sarif:
    description: "Upload a SARIF report to GitHub code scanning (the calling job needs security-events: write)."
    required: false
    default: "true"
  working-directory:
    description: Directory to run in (the repository root by default).
    required: false
    default: "."

outputs:
  exit-code:
    description: "Lockward exit code: 0 clean, 1 drift, 2 policy violation, 3 usage or config error, 4 internal error."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - name: Install and verify lockward
      shell: bash
      env:
        LOCKWARD_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    - name: Run lockward
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOCKWARD_ARGS: ${{ inputs.args }}
        LOCKWARD_SARIF: ${{ inputs.sarif }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: lockward

    - name: Fail on drift or policy violations
      if: ${{ steps.run.outputs.exit-code != '0' }}
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CODE"
